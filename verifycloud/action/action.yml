name: VerifyCloud RTL regression
description: Upload the checked-out RTL project to VerifyCloud, run a regression in isolated workers, and fail the step if tests fail.
author: VerifyCloud
branding: { icon: cpu, color: blue }

inputs:
  api-url:
    description: VerifyCloud base URL (https://…)
    required: true
  token:
    description: Project API key or personal access token. Pass it from a repository secret, never inline.
    required: true
  project:
    description: Project as <org>/<project>
    required: true
  regression:
    description: Regression to run (default — the configuration's default regression)
    required: false
    default: ""
  working-directory:
    description: Directory containing verifycloud.yaml
    required: false
    default: "."
  wait:
    description: Wait for the result and fail the step unless the job succeeds
    required: false
    default: "true"

outputs:
  job-id:
    description: Job id
    value: ${{ steps.run.outputs.job-id }}
  state:
    description: Final job state (empty when wait is false)
    value: ${{ steps.run.outputs.state }}
  url:
    description: Link to the run in the dashboard
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with: { node-version: "22" }
    - name: Build the VerifyCloud CLI from this action's source
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: |
        npm ci --no-audit --no-fund --workspace @verifycloud/shared --workspace @verifycloud/cli --include-workspace-root
        npm run build -w @verifycloud/shared
        npm run build -w @verifycloud/cli
    - name: Run regression
      id: run
      shell: bash
      env:
        VERIFYCLOUD_API_URL: ${{ inputs.api-url }}
        VERIFYCLOUD_TOKEN: ${{ inputs.token }}
        VC_PROJECT: ${{ inputs.project }}
        VC_REGRESSION: ${{ inputs.regression }}
        VC_DIR: ${{ inputs.working-directory }}
        VC_WAIT: ${{ inputs.wait }}
        VC_CLI: ${{ github.action_path }}/../packages/cli/dist/main.js
      run: bash "${{ github.action_path }}/run.sh"
