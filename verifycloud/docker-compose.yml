# One-command local deployment:  cp .env.example .env && docker compose up --build
# Then open http://localhost:8080 and log in with DEMO_ADMIN_EMAIL / DEMO_ADMIN_PASSWORD.
#
# SECURITY: the worker controls the host's Docker daemon (socket mount), which is
# root-equivalent on that host. Run workers on dedicated hosts/VMs that hold no
# other secrets; see docs/worker-security.md (rootless Docker / gVisor options).
name: verifycloud

services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: verifycloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: verifycloud
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifycloud -d verifycloud"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # pinned release; upstream stopped publishing community images in late 2025 —
    # if this tag is unavailable, use any S3-compatible service (see docs/deployment.md)
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes: [miniodata:/data]
    healthcheck:
      # recent MinIO images ship without curl; `mc` is included
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Builds the simulator image the worker starts for every run (not a service).
  sim-image:
    build: { context: ., dockerfile: deploy/sim-image/Dockerfile }
    image: verifycloud-sim:verilator
    entrypoint: ["true"]
    restart: "no"

  api:
    build: { context: ., dockerfile: deploy/Dockerfile, target: api }
    image: verifycloud-api:local
    env_file: .env
    environment:
      # local default; set NODE_ENV=production for a real deployment (then HTTPS
      # PUBLIC_URL, COOKIE_SECURE, SECRET_ENCRYPTION_KEY and a strong worker token are enforced)
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://verifycloud:${POSTGRES_PASSWORD}@postgres:5432/verifycloud
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      PORT: "8080"
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: deploy/Dockerfile, target: worker }
    image: verifycloud-worker:local
    environment:
      API_URL: http://api:8080
      WORKER_REGISTRATION_TOKEN: ${WORKER_REGISTRATION_TOKEN:?set WORKER_REGISTRATION_TOKEN in .env}
      SIM_IMAGE: verifycloud-sim:verilator
      SANDBOX: docker
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      WORKER_CPUS: ${WORKER_CPUS:-4}
      WORKER_MEMORY_MB: ${WORKER_MEMORY_MB:-8192}
      # must be the same absolute path on the host and in this container: the
      # host's Docker daemon bind-mounts run directories from it into sandboxes
      WORK_DIR: /var/lib/verifycloud-worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/verifycloud-worker:/var/lib/verifycloud-worker
    depends_on:
      api: { condition: service_healthy }
      sim-image: { condition: service_completed_successfully }
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
